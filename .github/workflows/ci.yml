name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Demo-only secret. It gates the destructive prepare/commit flow; the worker
  # reads it from .dev.vars (wrangler does not forward process.env), so the
  # setup step below writes it there as well.
  PRACHT_CONFIRMATION_SECRET: ci-forklight-confirmation-secret

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provide the worker's confirmation secret
        run: echo "PRACHT_CONFIRMATION_SECRET=$PRACHT_CONFIRMATION_SECRET" > .dev.vars

      - name: Apply D1 migrations to the local state
        run: pnpm run db:migrate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test

      - name: Agent-task evals
        run: pnpm run eval

      # Pinned to Chrome 151: 152 removed the navigator.modelContextTesting
      # automation hook these tests drive (the page API itself remains on
      # document.modelContext). Bump deliberately once a replacement hook ships.
      - name: Install Chrome 151 for Playwright
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: 151
          install-dependencies: true

      - name: End-to-end (real Chrome + WebMCP)
        run: pnpm run test:e2e
        env:
          CHROME_EXECUTABLE_PATH: ${{ steps.chrome.outputs.chrome-path }}

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
